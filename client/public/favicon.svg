<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#F9F9F9"/>

  <!-- Left slope: up to peak -->
  <path
    d="M5 24 L14 11"
    fill="none"
    stroke="#0D0D0D"
    stroke-width="2.6"
    stroke-linecap="round"
  />
  <!-- Right slope: peak continues upward-right with arrow tip -->
  <path
    d="M14 11 L24 6"
    fill="none"
    stroke="#2F7D5E"
    stroke-width="2.6"
    stroke-linecap="round"
  />
  <!-- Arrowhead at the tip -->
  <path
    d="M20.5 4.5 L24 6 L22.5 9.5"
    fill="none"
    stroke="#2F7D5E"
    stroke-width="2.2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
